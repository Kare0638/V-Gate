# Dry-run workers load no weights, so the long startup budget the base sets
# aside for weight loading and KV cache warmup is dead waiting time here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vgate-worker
spec:
  template:
    spec:
      containers:
        - name: vgate
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 10
            periodSeconds: 3
# volumeClaimTemplates is deliberately NOT patched here. This overlay used to
# shrink the claim to 1Gi because dry-run downloads no weights, which made the
# two overlays render different templates — and a StatefulSet's
# volumeClaimTemplates is immutable, so switching a cluster from the CPU
# overlay to the GPU one (or back) would be rejected by the API server with no
# way forward short of deleting the StatefulSet. Both overlays now inherit the
# base's 10Gi. On kind the request costs nothing: the local-path provisioner
# hands out a directory and ignores the size.
# k8s/validate_manifests.py fails the build if the two ever diverge again.
