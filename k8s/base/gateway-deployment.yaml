# The gateway owns admission, deduplication, caching, routing, and the public
# API. It never loads a model: setting worker endpoints makes VGateEngine build
# a RemoteBackend, which takes precedence over VGATE_DRY_RUN and engine_type
# (see vgate/engine.py::_create_backend). That is why there is no model cache
# volume and no GPU request here — a gateway that asked for either would be
# holding resources it cannot use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vgate-gateway
  labels:
    app.kubernetes.io/name: vgate
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vgate
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vgate
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: vgate
          # Version-pinned rather than ":latest". IfNotPresent below means a
          # node reuses whatever it already has under this tag, so a mutable
          # tag would let one node keep serving a months-old image with no
          # signal that it differs from its neighbours. A moving tag would need
          # imagePullPolicy: Always to be safe, which in turn breaks the kind
          # workflow where the image is side-loaded and never pushed anywhere.
          # A digest (vgate@sha256:...) is the only genuinely immutable form;
          # a version tag is a convention this repo keeps rather than a
          # guarantee the registry enforces.
          image: vgate:0.3.2-cpu
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: VGATE_ROLE
              value: "gateway"
            # Membership comes from resolving the headless Service, not from a
            # list. The gateway re-resolves on each health-check tick, so
            # `kubectl scale statefulset/vgate-worker` reaches it without this
            # manifest being edited — which a static list could not do: a new
            # vgate-worker-2 received no traffic, and a removed one was probed
            # forever.
            #
            # Endpoints are keyed by the pod's stable DNS name rather than its
            # address. A reverse lookup turns each resolved IP back into
            # vgate-worker-<n>.vgate-worker..., which survives restarts because
            # a StatefulSet reuses ordinals. Addresses do not, and every
            # vgate_worker_* metric is labelled by endpoint, so IP-keyed
            # membership would add a time series on every pod restart.
            - name: VGATE_WORKER__DISCOVERY__DNS_NAME
              value: "vgate-worker.vgate.svc.cluster.local"
            - name: VGATE_WORKER__DISCOVERY__PORT
              value: "8000"
            # /internal/generate is not an exempt path, so the gateway must
            # present the same key the workers validate against.
            - name: VGATE_WORKER__API_KEY
              valueFrom:
                secretKeyRef:
                  name: vgate-secrets
                  key: api-key
            # Taken whole from the Secret rather than assembled here, so no
            # entry in this list depends on the position of another. See
            # secret.yaml for why $(VAR) interpolation was rejected.
            - name: VGATE_SECURITY__API_KEYS
              valueFrom:
                secretKeyRef:
                  name: vgate-secrets
                  key: api-keys-json
            - name: VGATE_CONFIG_PATH
              value: "/app/config.yaml"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vgate-config
