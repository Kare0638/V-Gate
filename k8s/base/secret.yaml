# WARNING: This file contains placeholder secrets for development/demo only.
# In production, use one of the following:
#   - External Secrets Operator (https://external-secrets.io)
#   - Sealed Secrets (https://sealed-secrets.netlify.app)
#   - Cloud provider secret managers (AWS Secrets Manager, GCP Secret Manager, etc.)
#
# NEVER commit real credentials to version control.
#
# api-key and api-keys-json hold the same secret in the two shapes the config
# needs: the gateway sends the bare key to workers as worker.api_key, and both
# roles validate incoming requests against the security.api_keys list. Keeping
# both here, duplicated, is deliberate.
#
# The alternative was to store the key once and build the JSON in the manifests
# with Kubernetes' $(VAR) interpolation. That was tried and rejected: $(VAR)
# only resolves against variables defined EARLIER in the same container's env
# list, and strategic-merge patches reorder that list — the GPU overlay already
# moves two entries to the front. Worse, an unresolved reference is not an
# error; Kubernetes passes the literal "$(VGATE_API_KEY)" through. Gateway and
# worker would then agree on that literal as the API key, authentication would
# appear to succeed, and the real key would silently never be used.
apiVersion: v1
kind: Secret
metadata:
  name: vgate-secrets
  labels:
    app.kubernetes.io/name: vgate
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  api-key: "sk-vgate-dev-example"
  # Must contain the same key as api-key above.
  api-keys-json: '[{"key": "sk-vgate-dev-example", "name": "default", "rate_limit": 100}]'
  hf-token: "hf_PLACEHOLDER_REPLACE_WITH_REAL_TOKEN"
