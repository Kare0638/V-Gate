apiVersion: v1
kind: ConfigMap
metadata:
  name: vgate-config
  labels:
    app.kubernetes.io/name: vgate
    app.kubernetes.io/component: config
data:
  config.yaml: |
    version: "0.3.2"

    # Server settings
    server:
      host: "0.0.0.0"
      port: 8000

    # Model configuration
    model:
      model_id: "Qwen/Qwen2.5-1.5B-Instruct-AWQ"
      quantization: "awq"
      gpu_memory_utilization: 0.7
      max_model_len: 2048
      trust_remote_code: true
      enforce_eager: true

    # Request batching
    batch:
      max_batch_size: 8
      max_wait_time_ms: 50.0

    # Result cache
    cache:
      enabled: true
      maxsize: 1000

    # Default inference parameters
    inference:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 256

    # Logging configuration
    logging:
      level: "INFO"
      json_format: true

    # Prometheus metrics
    metrics:
      enabled: true

    # Security & Access Control
    #
    # api_keys is deliberately absent here. Both roles receive it as
    # VGATE_SECURITY__API_KEYS, interpolated from the vgate-secrets Secret, so
    # the key exists in exactly one place instead of being duplicated into a
    # ConfigMap that is plain text in the API server and in git. Environment
    # variables outrank this file and deep-merge into it, so only api_keys is
    # replaced — enabled, rate_limiting, and exempt_paths below still apply.
    security:
      enabled: true
      rate_limiting:
        enabled: true
        default_limit: 60
        window_seconds: 60
      exempt_paths:
        - "/health"
        - "/metrics"
