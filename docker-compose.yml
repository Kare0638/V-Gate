services:
  # ---------------------------------------------------------------------------
  # GPU mode — production inference
  # docker compose up vgate
  # ---------------------------------------------------------------------------
  vgate:
    build:
      context: .
      target: vgate-gpu
    image: vgate:latest
    ports:
      - "8000:8000"
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - VGATE_CONFIG_PATH=/app/config.yaml
      - VGATE_TRACING__ENABLED=true
      - VGATE_TRACING__OTLP_ENDPOINT=http://jaeger:4317
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # CPU mode — CI / testing / dry-run
  # docker compose --profile cpu up vgate-cpu
  # ---------------------------------------------------------------------------
  vgate-cpu:
    build:
      context: .
      target: vgate-cpu
    image: vgate:cpu
    ports:
      - "8000:8000"
    environment:
      - VGATE_DRY_RUN=true
      - VGATE_CONFIG_PATH=/app/config.yaml
      - VGATE_TRACING__ENABLED=true
      - VGATE_TRACING__OTLP_ENDPOINT=http://jaeger:4317
    profiles:
      - cpu

  # ---------------------------------------------------------------------------
  # Split mode — gateway and inference workers as separate processes
  # docker compose --profile split up
  #
  # The gateway holds no model: it owns admission, batching, caching, and
  # observability, and routes inference to workers over HTTP. Runs on the CPU
  # image with dry-run workers so the topology can be exercised without a GPU.
  # Streaming is not supported through a worker yet and returns 501.
  # ---------------------------------------------------------------------------
  vgate-gateway:
    build:
      context: .
      target: vgate-cpu
    image: vgate:cpu
    ports:
      - "8000:8000"
    environment:
      - VGATE_ROLE=gateway
      - VGATE_CONFIG_PATH=/app/config.yaml
      # Both workers are listed explicitly. Compose's `--scale` gives replicas
      # a shared DNS name rather than individual ones, which a static registry
      # cannot address one by one.
      - VGATE_WORKER__ENDPOINTS=["http://vgate-worker-1:8000","http://vgate-worker-2:8000"]
    depends_on:
      vgate-worker-1:
        condition: service_healthy
      vgate-worker-2:
        condition: service_healthy
    profiles:
      - split

  vgate-worker-1: &vgate-worker
    build:
      context: .
      target: vgate-cpu
    image: vgate:cpu
    environment:
      - VGATE_ROLE=worker
      - VGATE_DRY_RUN=true
      - VGATE_CONFIG_PATH=/app/config.yaml
    # Deliberately no published port: workers are reachable only from the
    # gateway on the compose network, not from the host.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    profiles:
      - split

  # Identical to worker-1. Stop it (`docker compose stop vgate-worker-2`) to
  # watch the gateway remove it from rotation and keep serving.
  vgate-worker-2:
    <<: *vgate-worker
    profiles:
      - split

  # ---------------------------------------------------------------------------
  # Prometheus — metrics collection
  # docker compose --profile monitoring up
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - vgate
    profiles:
      - monitoring
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Grafana — visualization
  # docker compose --profile monitoring up
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    profiles:
      - monitoring
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Jaeger — distributed tracing
  # docker compose --profile monitoring up
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
