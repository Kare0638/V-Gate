# V-Gate Configuration / V-Gate 配置文件
#
# Configuration priority (high to low):
# 1. Environment variables (e.g., VGATE_MODEL__MODEL_ID)
# 2. This YAML file
# 3. Default values in code
#
# Environment variable format: VGATE_<SECTION>__<KEY>
# Example: VGATE_BATCH__MAX_BATCH_SIZE=16

version: "0.3.2"

# Process role / 进程角色
#   gateway: serves the public API, owns batching/caching/admission control
#   worker:  runs inference only, exposes /internal/generate for a gateway
role: "gateway"

# Server settings / 服务器设置
server:
  host: "0.0.0.0"
  port: 8000

# Remote inference workers, read by the gateway role / 远程推理 worker
#
# Leave `endpoints` empty to keep inference in the gateway process (the
# single-process default). Listing endpoints moves inference to separate
# worker processes, and the gateway stops loading a model entirely.
#
# Requests are routed round-robin across healthy workers. A worker that
# refuses a connection is retried on another worker; a worker that times out
# is not, because it may already be generating and retrying would double the
# GPU cost of one request.
#
# Streaming is not supported through workers yet: stream=true returns 501.
worker:
  endpoints: []
  # endpoints: ["http://127.0.0.1:8001", "http://127.0.0.1:8002"]

  # Membership from DNS instead of the list above. Point `dns_name` at a
  # headless Service and the gateway re-resolves it on each health-check tick,
  # so scaling the worker set reaches the gateway without a config change --
  # which a static list cannot do: a new worker gets no traffic, and a removed
  # one is probed forever.
  #
  # Endpoints are keyed by each pod's stable DNS name, obtained by reverse
  # lookup of the resolved addresses. Addresses change on restart, and every
  # vgate_worker_* metric is labelled by endpoint, so address identity would
  # add a time series per restart. A cluster without PTR records falls back to
  # addresses, and says so in the log.
  #
  # Leave `dns_name` null outside Kubernetes; docker-compose and bare processes
  # use the list above.
  discovery:
    dns_name: null
    # dns_name: "vgate-worker.vgate.svc.cluster.local"
    port: 8000
    scheme: "http"
  timeout_seconds: 120.0
  connect_timeout_seconds: 5.0

  # Background probing of /health. Runs independently of request traffic, so
  # a recovered worker rejoins even while the gateway is idle.
  health_check_interval_seconds: 5.0
  health_check_timeout_seconds: 2.0
  # Consecutive failures before a worker leaves rotation, and consecutive
  # successes before it returns. Above 1 so a single blip does not flap it.
  failure_threshold: 2
  success_threshold: 2

  # Sent as `Authorization: Bearer <key>` to the worker, on both generate
  # calls and health probes. Required when the worker runs with
  # security.enabled, since /internal/generate is not exempt.
  # api_key: "sk-vgate-worker-xxxxx"

# Model configuration / 模型配置
model:
  model_id: "Qwen/Qwen2.5-1.5B-Instruct-AWQ"
  quantization: "awq"
  gpu_memory_utilization: 0.7
  max_model_len: 2048
  trust_remote_code: true
  enforce_eager: true
  engine_type: "vllm"  # "vllm" or "sglang" / 推理后端引擎

# Request batching / 请求批处理
batch:
  # Maximum concurrent inferences (admission control).
  #
  # NOTE: the meaning of this key changed. It used to size a batching window
  # -- how many requests were collected before one backend call. The gateway
  # no longer builds batches: each request calls the backend on its own, so
  # a routing decision happens per request, and vLLM/SGLang do the actual
  # batching internally (which they do better, since they can admit a request
  # into a batch that is already decoding).
  #
  # The key is unchanged so existing configs keep loading, and the value
  # still bounds how much work reaches the backend at once.
  #
  # With a backend that is not safe to call concurrently (the in-process
  # vLLM/SGLang engines), the effective limit is forced to 1 regardless of
  # this value. It takes effect when the gateway forwards to remote workers.
  max_batch_size: 8

  # DEPRECATED and ignored. There is no batching window to wait for. Still
  # accepted so existing configs do not fail to load; the startup log reports
  # the value it is ignoring.
  max_wait_time_ms: 50.0

# Result cache / 结果缓存
cache:
  enabled: true
  maxsize: 1000

# Default inference parameters / 默认推理参数
inference:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 256

# Logging configuration / 日志配置
logging:
  level: "INFO"
  json_format: true

# Prometheus metrics / Prometheus 指标
metrics:
  enabled: true

# Distributed Tracing (OpenTelemetry) / 分布式追踪 (OpenTelemetry)
tracing:
  enabled: false              # Enable OpenTelemetry tracing / 启用 OpenTelemetry 追踪
  service_name: "vgate"       # Service name in traces / 追踪中的服务名称
  otlp_endpoint: "http://localhost:4317"  # OTLP gRPC endpoint / OTLP gRPC 端点
  otlp_insecure: true         # Use insecure connection / 使用非加密连接
  sample_rate: 1.0            # Sampling rate (0.0-1.0) / 采样率
  log_correlation: true       # Inject trace_id into logs / 将 trace_id 注入日志

# Security & Access Control / 安全与访问控制
security:
  enabled: false  # Set to true in production / 生产环境设为 true

  # API Keys / API 密钥
  # Format: Authorization: Bearer <key>
  api_keys:
    - key: "sk-vgate-dev-example"
      name: "development"
      rate_limit: 1000  # requests per minute
    # Add more keys as needed / 按需添加更多密钥
    # - key: "sk-vgate-prod-xxxxx"
    #   name: "production"
    #   rate_limit: 100

  # Rate Limiting / 速率限制
  rate_limiting:
    enabled: true
    default_limit: 60    # requests per minute for unknown keys / 未知密钥的默认限制
    window_seconds: 60   # sliding window size / 滑动窗口大小

  # Paths exempt from authentication / 免认证路径
  exempt_paths:
    - "/health"
    - "/metrics"
